name: CI générale

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Exécuter les tests
        run: npm test -- --run

      - name: Construire le frontend
        run: npm run build

  backend:
    name: Backend — tests et Ruff
    # The OCR packages below are verified against this supported runtime.
    # Avoid silently changing the system toolchain with ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/pdf-engine

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/pdf-engine/uv.lock

      - name: Installer la toolchain OCR système
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            ghostscript \
            ocrmypdf \
            qpdf \
            tesseract-ocr \
            tesseract-ocr-eng

      - name: Vérifier la toolchain OCR
        run: |
          set -euo pipefail
          echo "Tesseract:"
          command -v tesseract
          tesseract --version
          echo "Langues Tesseract:"
          tesseract --list-langs
          tesseract --list-langs | grep --fixed-strings --line-regexp "eng"
          echo "OCRmyPDF:"
          command -v ocrmypdf
          ocrmypdf --version
          echo "Ghostscript:"
          command -v gs
          gs --version
          echo "QPDF:"
          command -v qpdf
          qpdf --version

      - name: Installer les dépendances
        run: uv sync --locked

      - name: Exécuter les tests
        run: uv run pytest

      - name: Vérifier le code Python
        run: uv run ruff check .
