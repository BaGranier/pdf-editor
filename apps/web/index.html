<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6fa" />
    <link rel="icon" type="image/svg+xml" href="/pdf-studio-mark.svg" />
    <title>PDF Studio Local</title>
    <style>
      :root { color-scheme: light dark; background: #f4f6fa; color: #172033; }
      @media (prefers-color-scheme: dark) { :root { background: #101522; color: #edf2ff; } }
      body { margin: 0; background: inherit; color: inherit; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      #root { min-height: 100vh; }
      .initial-state { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: .6rem; padding: 2rem; text-align: center; }
      .initial-state img { width: 52px; height: 52px; }
      .initial-state p { margin: 0; opacity: .72; }
      .initial-state__spinner { width: 18px; height: 18px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; opacity: .7; animation: spin .7s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="initial-state" role="status" aria-live="polite">
        <img src="/pdf-studio-mark.svg" alt="" />
        <strong>PDF Studio Local</strong>
        <p>Chargement de l’interface…</p>
        <span class="initial-state__spinner" aria-hidden="true"></span>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
