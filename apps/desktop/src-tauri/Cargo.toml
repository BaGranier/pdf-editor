[package]
name = "pdf-studio-local"
version = "0.1.0"
description = "Native shell for the local-first PDF editor"
authors = ["PDF Studio Local contributors"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "pdf_studio_local_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-shell = "2.3.5"
